plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}


android {
    namespace  "com.rbsh.medicle_sales_rbsh"
    //compileSdk = flutter.compileSdkVersion
    //ndkVersion = flutter.ndkVersion
    compileSdkVersion 35
    ndkVersion = "25.1.8937393"




    /*compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        //coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }*/

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true // Enable desugaring for Java 8 features
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.rbsh.medicle_sales_rbsh"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        //minSdk = flutter.minSdkVersion
        minSdkVersion 21
        targetSdkVersion 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // Enable multidex
        multiDexEnabled true

        manifestPlaceholders = [
                appAuthRedirectScheme: "msauth"
        ]
    }



    signingConfigs {
        create("release") {
            storeFile = file("/Users/sandeepmaurya/AndroidStudioProjects/medicle_sales_rbsh/android/upload-keystore.jks")
            storePassword = "GlucksCare@12345" // Use actual keystore password
            keyAlias = "upload" // Your alias name
            keyPassword = "GlucksCare@12345" // Use actual key password
        }
    }


    buildTypes {
        release {
            signingConfig = signingConfigs["release"]  // Use correct release signing config
            minifyEnabled = true  //  Enable ProGuard (optional)
            shrinkResources = true  //  Remove unused resources (optional)
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")

            // Signing with the debug keys for now, so `flutter run --release` works.
            //signingConfig = signingConfigs.debug
        }
    }

}


dependencies {

    implementation 'androidx.multidex:multidex:2.0.1'

    implementation 'com.google.android.gms:play-services-location:21.3.0'  // Add this line for location services
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5' // Enable desugaring for Java 8 features



    //Firebase
    implementation platform('com.google.firebase:firebase-bom:32.7.2')  // BOM version
    implementation 'com.google.firebase:firebase-messaging'





    // For AGP 7.4+
    //  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
    // For AGP 7.3
    // coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.2.3'
    // For AGP 4.0 to 7.2
    // coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.1.9'
}


flutter {
    source = "../.."
}
