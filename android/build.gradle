// android/build.gradle (Top-Level)

configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"
        force "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0"
    }
}


buildscript {

    /*ext {
        playServicesLocationVersion = "21.3.0"
    }*/
    repositories {
        google()  // This is where we fetch Google services dependencies
        mavenCentral()
        maven { url "https://maven.transistorsoft.com" }   // ← add

    }
    dependencies {
        classpath 'com.google.gms:google-services:4.3.15'
        classpath 'com.android.tools.build:gradle:8.0.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0"

    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://maven.transistorsoft.com" }
    }
    subprojects {
        afterEvaluate { project ->
            if (project.hasProperty('android')) {
                project.android {
                    if (namespace == null) {
                        namespace project.group
                    }
                    compileSdkVersion 35
                    defaultConfig {
                        minSdkVersion 21
                        targetSdkVersion 35
                    }
                }
            }
        }
    }
}


// ️ Add the block here (top-level, not nested in anything else)
subprojects { p ->
    afterEvaluate {
        if (p.plugins.hasPlugin("org.jetbrains.kotlin.android") ||
                p.plugins.hasPlugin("kotlin-android")) {
            tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions { jvmTarget = "17" }
            }
        }
        def androidExt = p.extensions.findByName("android")
        // FIXED: Added && p.name != "app" so it doesn't overwrite our app settings
        if (androidExt != null && p.name != "app") {
            androidExt.compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
        }
    }
}


rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
