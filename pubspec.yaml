dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3


flutter_icons:
  android: true
  ios: true
  image_path: "assets/app_icon/app_icon.png" # Update with your icon path
  adaptive_icon_background: "#ffffff" # Background color for Android adaptive icons
  #adaptive_icon_foreground: "assets/app_icon/adaptive_icon.png" # Optional foreground

flutter:
  uses-material-design: true
  #---------- Local Assets ---------------------#

  assets:
    - assets/logos/
    - assets/app_icon/
    - assets/images/dummy.jpeg
    - assets/images/pdf.png
    - assets/upload_queue.csv

  #------------- Local fonts-------------------#


  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 800
